name: Raspberry Pi release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release tag
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR, for example v1.4." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --cwd frontend install --non-interactive

      - name: Build Raspberry Pi package
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash deploy/raspberry-pi/package.sh update

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "deploy/raspberry-pi/rom-translator-update-v${{ steps.release.outputs.version }}.tar.gz" \
            --title "ROM Translator $GITHUB_REF_NAME" \
            --generate-notes